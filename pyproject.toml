[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elevatorwatch"
version = "0.1.0"
description = "Track WMATA elevator/escalator outages for the stations you care about. Stdlib-only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["wmata", "transit", "accessibility", "ada", "gtfs", "elevators"]

[project.scripts]
elevatorwatch = "elevatorwatch.__main__:main"

[tool.setuptools]
packages = ["elevatorwatch"]
